name: Advanced CI/CD Integration Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # JOB 1: Validates code layout, syntax formatting, and complication rules early
  code-quality: 
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'

    # FIX: Executable steps that use the configured cache layout to validate syntax stability
    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes --severity warn

    - name: Static Code Analysis
      run: dotnet build --configuration Release /warnaserror

  # JOB 2: Complies the source files inside target Docker configurations
  complie-and-build:
    name:  Docker Build & Compile
    runs-on: ubuntu-latest
    needs: code-quality # Only starts if static formatting checks pass cleanly
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Build Application Containers
      run: docker compose build

  # JOB 3: Spins up container layout and evaluates cross-dependency integrations
  integration-testing:
    name: System Integration
    runs-on: ubuntu-latest
    needs: complie-and-build # Only starts if the Docker build completes successfully
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Build and Launch Application Mesh
      run: docker compose up --build -d

    - name: Grace Period for Database Boot
    - run: |
        echo "Giving Microcrosoft SQL Server 25 seconds to compile table setups..."
        sleep 25

    - name: Wait for API Readiness
      run: |
        echo "Waiting for ChickenAPI to wake up at http://localhost:8000..."
        timeout 60s sh -c 'until curl -s http://localhost:8000/GetMeEggs > /dev/null; do sleep 2; done'
        echo "ChickenAPI is up and running!"

    - name: Integration Step 1 - Seed Data via API
      run: |
        echo "Posting a new chicken payload to the database..."
        curl -X POST http://localhost:8000/api/Chicken \
          -H "Content-Type: application/json" \
          -d '{"name": "Chuck Norris", "breed": "Rhode Island Red"}' \
          --fail --verbose

    - name: Integration Step 2 - Verify Front-End MVC Data Rendering
      run: |
        echo "Quering the MVC web application home page on on port 80..."
        MVC_ReSPONSE=$(curl -s http://localhost:80)

        echo "Asserting that the front-end MVC view successfully displays the dynamic chicken dataAPI string context..."
        if echo "$MVC_RESPONSE" | grep -q "Chuck Norris"; then
          echo "Success: MVC interface successfully fetched and displayed containerized API data!"
        else
          echo "Error: Data assertion failed. The MVC home page is not showing the injected database string payload."
          exit 1
        fi

    - name: Tear Down Application Mesh and Logs
      if: always() # Ensures cleanup runs regardless of test success or failure
      run: |
      docker compose logs api-service > api-container-debug.log
      docker compose logs chick-db-service > db-container-debug.log
      docker compose logs mvc-service > mvc-container-debug.log
      docker compose down --volumes 

  #JOB 4: Automated continuos delivery task gated behind previos validiation approvals
  cd-deployment:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: integration-testing # Only starts if all previous stages complete successfully
    if: github.ref == 'refs/heads/main' # Only deploys on pushes to the main branch
    environment:
      name: Execute Server Infrastucture Sync
      run: |
        echo "All automated tests passed cleanly. Initiating production handshake scripts..."
       